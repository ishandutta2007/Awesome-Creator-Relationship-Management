<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card/Pill Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    
    <!-- Title Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadows for Text readability and depth -->
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#090d16" flood-opacity="1" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- 2. Dynamic Background Wave Line Graphs -->
  <g opacity="0.25">
    <path d="M -100 280 Q 200 150, 500 270 T 1100 180 T 1300 250" fill="none" stroke="#818cf8" stroke-width="3">
      <animate attributeName="d" 
               values="M -100 280 Q 200 150, 500 270 T 1100 180 T 1300 250;
                       M -100 250 Q 250 320, 550 200 T 1050 240 T 1300 210;
                       M -100 280 Q 200 150, 500 270 T 1100 180 T 1300 250" 
               dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M -100 320 Q 300 200, 600 310 T 1200 220" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="d" 
               values="M -100 320 Q 300 200, 600 310 T 1200 220;
                       M -100 290 Q 200 340, 650 230 T 1200 270;
                       M -100 320 Q 300 200, 600 310 T 1200 220" 
               dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- 3. Dynamic Animated Ambient Glow Orbs (Strictly in Background) -->
  <g opacity="0.6">
    <circle cx="150" cy="100" r="140" fill="#6366f1" filter="blur(50px)">
      <animate attributeName="cy" values="100;130;100" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;160;140" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="160" fill="#ec4899" filter="blur(60px)">
      <animate attributeName="cy" values="300;270;300" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="160;130;160" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="80" r="110" fill="#06b6d4" filter="blur(45px)">
      <animate attributeName="cx" values="900;930;900" dur="11s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. Dynamic Floating Decorative Elements & Cards (Positions set along top/bottom edges to leave middle clear) -->
  <!-- Top Left Pill: Creator Stats -->
  <g filter="url(#cardShadow)">
    <g transform="translate(60, 45)">
      <animateTransform attributeName="transform" type="translate" values="60,45; 60,37; 60,45" dur="6s" repeatCount="indefinite" />
      <rect width="170" height="42" rx="21" fill="rgba(30, 27, 75, 0.75)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
      <circle cx="21" cy="21" r="12" fill="url(#purpleGlow)" />
      <text x="21" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚀</text>
      <text x="42" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">250M+ Creators</text>
    </g>
  </g>

  <!-- Bottom Left Pill: Analytics -->
  <g filter="url(#cardShadow)">
    <g transform="translate(80, 315)">
      <animateTransform attributeName="transform" type="translate" values="80,315; 80,323; 80,315" dur="7s" repeatCount="indefinite" />
      <rect width="190" height="44" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
      <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">📊</text>
      <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">ROI &amp; Attribution</text>
      <circle cx="165" cy="22" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Top Right Card: Deal Flow -->
  <g filter="url(#cardShadow)">
    <g transform="translate(950, 40)">
      <animateTransform attributeName="transform" type="translate" values="950,40; 950,48; 950,40" dur="6.5s" repeatCount="indefinite" />
      <rect width="190" height="50" rx="12" fill="rgba(30, 27, 75, 0.8)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" />
      <rect x="12" y="12" width="26" height="26" rx="6" fill="url(#pinkGlow)" />
      <text x="25" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">💼</text>
      <text x="48" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Sponsorships</text>
      <text x="48" y="40" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Automated Pipeline</text>
    </g>
  </g>

  <!-- Bottom Right Card: Matchmaking -->
  <g filter="url(#cardShadow)">
    <g transform="translate(940, 310)">
      <animateTransform attributeName="transform" type="translate" values="940,310; 940,302; 940,310" dur="8s" repeatCount="indefinite" />
      <rect width="200" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
      <rect x="6" y="6" width="34" height="34" rx="17" fill="url(#amberGlow)" />
      <text x="23" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🤖</text>
      <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AI Matchmaking</text>
    </g>
  </g>

  <!-- 5. Foreground Content Layer (High Z-Index, Crisp Typography, Protected Area) -->
  <!-- Title Badge -->
  <g transform="translate(600, 105)" filter="url(#titleShadow)">
    <rect x="-110" y="-16" width="220" height="30" rx="15" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(165, 180, 252, 0.4)" stroke-width="1.5" />
    <text x="0" y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED DIRECTORY 2026</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#titleShadow)">
    <text x="600" y="175" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Creator Relationship Management
    </text>
    <!-- Highlight Sub-title accent line -->
    <text x="600" y="225" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="0" text-anchor="middle">
      (CRM &amp; Influencer Tech Stack)
    </text>
  </g>

  <!-- Subtitle Description -->
  <g filter="url(#titleShadow)">
    <text x="600" y="270" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
      Enterprise SaaS Platforms • Open-Source Solutions • AI Creator Tools • Analytics
    </text>
  </g>

</svg>
